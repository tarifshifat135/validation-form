<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>\
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <section class="contact">
        <div class="form_container">
            <div class="input_group">
                <input id="username" class="input_box" type="text" name="username" placeholder="enter your name">
                <span id="nameError" class="error"></span>
            </div>
            <div class="input_group">
                <input id="email" class="input_box" type="email" name="email" placeholder="enter your email">
                <span id="emailError" class="error"></span>

            </div>
            <div class="input_group">
                <input id="password" class="input_box" type="password" name="password" placeholder="enter your password">
                <span id="passwordError" class="error"></span>
            </div>
            <div class="input_group">
                <input id="confirmpassword" class="input_box" type="password" name="confirmpassword" placeholder="confirm your password">
                <span id="confirmPasswordError" class="error"></span>
            </div>
            <div class="input_group">
                <button class="btn">Submit</button>
            </div>
        </div>


    </section>



    <script src="./js/script.js"></script>
</body>

</html>
